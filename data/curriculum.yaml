raw_text: |
  OKR (Objectives and Key Results) — это методология постановки бизнес-целей, которая помогает компаниям фокусироваться на главном и совершать прорывы. В переводе с английского термин означает «Цели и ключевые результаты». Система соединяет амбициозную стратегию руководства с ежедневными задачами рядовых сотрудников.
  Методику придумал Энди Гроув в Intel еще в 1970-х годах для захвата рынка микропроцессоров, а сегодня по ней работают Т-Банк, Авито и Додо Пицца. 
  Система строится всего на двух элементах:
  Objective (Цель) — качественное описание того, куда вы хотите прийти. Цель должна быть вдохновляющей, дерзкой и понятной каждому сотруднику без использования цифр.
  Key Results (Ключевые результаты) — количественные метрики от 3 до 5 штук, которые доказывают достижение цели. Они должны быть измеримыми, сложными, но достижимыми.
  В отличие от жестких KPI, OKR не спускаются сверху вниз как приказ. Команды сами предлагают свои показатели, что дает им чувство ответственности за результат. Главная философия метода гласит: достичь OKR на 70% — это уже победа. Если команда регулярно выполняет план на все 100%, значит, она ставит слишком простые задачи и не рискует ради роста.
  Цикл планирования обычно длится квартал. Это позволяет бизнесу оставаться гибким: если рынок изменился или гипотеза оказалась неверной, цель можно быстро скорректировать без бюрократии.

topics:
  okr_basics:
    id: "okr_basics"
    title: "Сущность OKR и история"
    description: "Определение OKR, расшифровка термина, происхождение (Intel, Энди Гроув) и связка стратегии с практикой."
    intro_question: "Привет! Я твой сократический наставник по методологии OKR. Ты знаешь что такое OKR?"
    declarative_facts:
      - "Методику разработал Энди Гроув в корпорации Intel в 1970-х годах"
      - "OKR соединяет стратегию руководства с задачами сотрудников"
      - "Примеры внедрения: Т-Банк, Авито, Додо Пицца"
    key_concepts:
      - "стратегия"
      - "синхронизация"
      - "Энди Гроув"
      - "Intel"
      - "фокус"
    prerequisites: []
    forbidden_direct_answers:
      - "захват рынка микропроцессоров"
      - "доминирование на рынке"
    fallback_socratic_prompt: "Давай сделаем шаг назад: вспомни, как расшифровывается аббревиатура OKR и какую проблему несогласованности отделов она решает?"
    rubric_criteria:
      - "Ученик понимает связь стратегии и операционных задач"
      - "Ученик знает исторический контекст появления методики (Intel, Энди Гроув)"

  objective_rules:
    id: "objective_rules"
    title: "Формулирование Objective (Цели)"
    description: "Качественное описание цели: вдохновляющая, дерзкая, без использования цифр."
    intro_question: "Переходим к первому элементу — Цели (Objective). Как ты понимаешь, почему по правилам OKR в самой цели категорически запрещено использовать числа, проценты и сроки?"
    declarative_facts:
      - "Objective — это качественная вдохновляющая цель, отвечающая на вопрос 'Куда мы идем?'"
      - "В формулировке Objective категорически запрещено использовать цифры и проценты"
    key_concepts:
      - "качественный"
      - "вектор"
      - "без цифр"
      - "вдохновение"
      - "амбиции"
    forbidden_direct_answers:
      - "%"
      - "процент"
      - "рублей"
      - "долларов"
      - "штук"
    prerequisites:
      - "okr_basics"
    fallback_socratic_prompt: "Помни главное правило: Objective отвечает на вопрос «Куда идем?» и задает качественный вектор. Попробуй убрать из формулировки любые числа."
    rubric_criteria:
      - "Формулировка цели носит исключительно качественный характер"
      - "В Objective отсутствуют численные метрики"

  key_results_rules:
    id: "key_results_rules"
    title: "Формулирование Key Results (Ключевых результатов)"
    description: "Количественные метрики: от 3 до 5 штук, измеримые, сложные, но достижимые."
    intro_question: "Цель задает качественное направление. Теперь разберем Ключевые результаты (Key Results): каким главным критерием они должны обладать, чтобы однозначно подтвердить, что цель достигнута?"
    declarative_facts:
      - "Key Results должны содержать измеримые количественные метрики"
      - "Оптимальное количество KR — от 3 до 5 штук на одну цель"
      - "Ключевые результаты доказывают факт достижения качественной цели"
    key_concepts:
      - "измеримость"
      - "количественный"
      - "метрики"
      - "от 3 до 5"
    prerequisites:
      - "objective_rules"
    forbidden_direct_answers:
      - "kr1: "
      - "ключевой результат 1: "
      - "готовые метрики под кейс пользователя"
    fallback_socratic_prompt: "Как именно команда докажет, что цель достигнута? Какими измеримыми числовыми показателями это подтверждается?"
    rubric_criteria:
      - "Ключевые результаты содержат конкретные числовые индикаторы"
      - "Количество KR находится в диапазоне от 3 до 5"

  okr_philosophy_and_kpi:
    id: "okr_philosophy_and_kpi"
    title: "Философия OKR, отличие от KPI и цикл планирования"
    description: "Инициатива снизу вверх, правило 70%, квартальное планирование и гибкость."
    intro_question: "Теперь перейдем к фундаментальной философии OKR. Почему при оценке итогов квартала достижение 70% от плана считается успехом, тогда как в классических KPI за это могли бы лишить премии?"
    declarative_facts:
      - "Выполнение плана на 70% в OKR считается успехом, так как цели ставятся амбициозно"
      - "100% выполнение свидетельствует о заниженной планке и отсутствии риска"
      - "OKR формируются снизу вверх (bottom-up), а не спускаются директивно как KPI"
      - "Стандартный цикл планирования — один квартал"
    key_concepts:
      - "порог 70%"
      - "снизу вверх"
      - "квартал"
      - "риск"
      - "премии"
    prerequisites:
      - "key_results_rules"
    forbidden_direct_answers:
      - "готовый сравнительный анализ KPI и OKR за пользователя"
    fallback_socratic_prompt: "Подумай об отношении к риску: почему регулярное выполнение плана на 100% в OKR говорит о том, что цели были слишком простыми?"
    rubric_criteria:
      - "Понимание порога 70% как критерия амбициозности"
      - "Понимание отличия bottom-up планирования OKR от директивного KPI"
      - "Знание квартального горизонта планирования"